<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#23272a">
  <title>同學象棋室 V2.2</title>
  <!--
    使用前請在 Firebase 專案 battle-f41ad 啟用 Authentication > Anonymous，
    並在 Realtime Database Rules 設定依匿名 uid 與房間席位控管的讀寫權限。
    HTML 不能代替資料庫伺服端安全規則。新版請部署在 HTTPS 網址。
    QR Code 程式庫與 Firebase SDK 都透過 HTTPS CDN 載入，仍為單一 HTML 檔案。

    小型好友房示範 Realtime Database Rules（部署前請於 Firebase Console 的
    Realtime Database > Rules 審核，將 chessV2 節點併入現有規則；
    不要整份覆蓋現行規則，以免影響舊版 rooms 資料）：
    如果現行根目錄 .read/.write 設為 true，需先把舊版開放權限
    移到 rooms 節點，根目錄不可繼承公開寫入，否則 chessV2 子規則無效。
    {
      "rules": {
        "chessV2": {
          "$room": {
            ".read": "auth != null",
            ".write": "auth != null && ((!data.exists() && newData.child('meta/hostUid').val() == auth.uid) || (data.exists() && data.child('meta/hostUid').val() == auth.uid))",
            "members": {
              "$uid": {
                ".write": "auth != null && auth.uid == $uid",
                ".validate": "newData.hasChildren(['name','joinedAt']) && newData.child('name').isString() && newData.child('name').val().length <= 14"
              }
            },
            "presence": { "$uid": { "$session": { ".write": "auth != null && auth.uid == $uid" } } },
            "invite": {
              "status": {
                ".write": "auth != null && data.val() == 'pending' && root.child('chessV2').child($room).child('invite/to').val() == auth.uid && (newData.val() == 'accepted' || newData.val() == 'declined')"
              }
            },
            "requests": {
              "challenges": { "$uid": { ".write": "auth != null && auth.uid == $uid" } },
              "undo": { ".write": "auth != null && (root.child('chessV2').child($room).child('seats/red').val() == auth.uid || root.child('chessV2').child($room).child('seats/black').val() == auth.uid)" },
              "draw": { ".write": "auth != null && (root.child('chessV2').child($room).child('seats/red').val() == auth.uid || root.child('chessV2').child($room).child('seats/black').val() == auth.uid)" }
            },
            "game": {
              ".write": "auth != null && (root.child('chessV2').child($room).child('seats/red').val() == auth.uid || root.child('chessV2').child($room).child('seats/black').val() == auth.uid) && newData.child('version').val() == data.child('version').val() + 1 && newData.child('round').val() == data.child('round').val()"
            },
            "voice": { ".write": "auth != null && (root.child('chessV2').child($room).child('seats/red').val() == auth.uid || root.child('chessV2').child($room).child('seats/black').val() == auth.uid)" }
          }
        }
      }
    }
    本規則限制一般觀戰者寫入棋局，但不能在伺服器端證明每一步棋合法；
    如須防作弊，需用可信後端驗證走步。不應將上述示範直接視為完整資安稽核。
  -->
  <style>
    :root { --bg:#23272a; --panel:#30363d; --panel2:#393f47; --gold:#d9a45b; --muted:#b7bec6; --red:#bc2828; --line:#674427; --unit:min(50px, calc((100vw - 34px) / 9)); }
    * { box-sizing:border-box; }
    body { margin:0; padding:12px 12px 36px; font-family:"Microsoft JhengHei","PingFang TC",sans-serif; background:var(--bg); color:#f4f4f4; text-align:center; }
    button, input, select { font:inherit; }
    button { cursor:pointer; border:0; background:#47515c; color:#fff; padding:10px 13px; border-radius:9px; font-weight:700; }
    button:hover:not(:disabled) { filter:brightness(1.1); }
    button:disabled { opacity:.42; cursor:not-allowed; }
    button.primary { background:#b56b2a; }
    button.danger { background:#8d3434; }
    button.subtle { background:#3b424a; }
    input,select { border:1px solid #667078; background:#262c32; color:#fff; border-radius:9px; padding:10px; min-width:0; }
    input:focus, select:focus, button:focus-visible { outline:2px solid #f6c47b; outline-offset:2px; }
    .hide { display:none!important; }
    .shell { max-width:900px; margin:auto; }
    h1 { color:#f3d29b; margin:8px 0 4px; font-size:clamp(24px,4vw,35px); }
    .subtitle { color:#c4c9cc; font-size:13px; margin:0 0 14px; }
    .card { background:var(--panel); border:1px solid #525b64; box-shadow:0 4px 18px #0002; border-radius:14px; padding:15px; margin:10px auto; }
    .welcome { width:min(100%,480px); margin:30px auto; padding:24px; }
    .welcome h2 { margin:0 0 9px; font-size:23px; }
    .welcome label { display:block; text-align:left; color:#e9dbca; font-size:14px; margin:17px 0 6px; }
    .welcome input { width:100%; }
    .welcome .actions { display:flex; gap:9px; margin-top:18px; }
    .welcome .actions button { flex:1; min-height:50px; }
    .hint { color:var(--muted); font-size:12px; line-height:1.6; }
    .error { color:#ff9c93; }
    .room-top { display:flex; gap:8px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
    .room-title { font-size:18px; font-weight:800; text-align:left; }
    .room-code { font-size:13px; color:#f4c993; }
    .room-actions { display:flex; flex-wrap:wrap; gap:6px; }
    .players { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:12px; }
    .player { background:#252b30; border-radius:10px; min-height:71px; padding:12px; text-align:left; border:1px solid #414b52; }
    .player .phead { display:flex; justify-content:space-between; gap:8px; align-items:center; }
    .player strong { font-size:17px; overflow-wrap:anywhere; }
    .player small { display:block; margin-top:6px; color:var(--muted); }
    .player.turn-active { border-color:#e7b55f; background:#34302b; box-shadow:inset 0 0 0 1px #e7b55f77,0 0 14px #e8b45a24; }
    .player.turn-active.turn-red { border-color:#fa8179; background:#482d31; }
    .player.turn-active.turn-black { border-color:#e9c68e; background:#353734; }
    .player.turn-active strong::before { content:'▶ '; color:#f5ce87; }

    .pill { border-radius:99px; font-size:11px; padding:3px 8px; background:#5c6570; white-space:nowrap; }
    .pill.red { background:#8c3534; } .pill.black { background:#51565c; } .pill.host { color:#30200d; background:#edbc70; }
    .game-layout { display:grid; grid-template-columns:minmax(0,1fr) 265px; align-items:start; gap:14px; }
    .board-side { min-width:0; display:flex; flex-direction:column; align-items:center; }
    .controls { display:flex; justify-content:center; gap:7px; flex-wrap:wrap; margin:7px auto; }
    .controls button { padding:8px 10px; font-size:13px; }
    .status { font-size:clamp(17px,3vw,22px); font-weight:900; padding:11px 15px; min-height:49px; margin:5px 0 7px; border-radius:12px; background:#343c43; border:2px solid #59616a; color:#f0d7a7; width:100%; max-width:calc(var(--unit) * 9); transition:background .22s,border-color .22s; }
    .status.turn-red { background:#583037; border-color:#e37676; color:#fff2dd; }
    .status.turn-black { background:#454640; border-color:#e1b978; color:#fff3dc; }
    .status.turn-mine { box-shadow:0 0 0 2px #ffd78c33,0 0 18px #eeb96733; animation:turnGlow 1.7s ease-in-out infinite alternate; }
    .status .status-sub { display:block; font-size:12px; font-weight:600; color:#e9ded0; margin-top:3px; }
    @keyframes turnGlow { from { box-shadow:0 0 0 2px #f2c57b18; } to { box-shadow:0 0 0 3px #f2c57b75,0 0 20px #f2c57b33; } }

    .board { position:relative; width:calc(var(--unit) * 9); height:calc(var(--unit) * 10); max-width:100%; background:#e7c388; border:3px solid var(--line); border-radius:4px; box-shadow:0 10px 26px #0008; margin:6px auto; }
    .board svg { width:100%; height:100%; position:absolute; inset:0; pointer-events:none; }
    .target { position:absolute; width:10.7%; height:9.6%; transform:translate(-50%,-50%); z-index:1; cursor:pointer; }
    .piece { position:absolute; width:9.4%; height:8.5%; transform:translate(-50%,-50%); display:flex; align-items:center; justify-content:center; border-radius:50%; background:radial-gradient(circle at 33% 29%,#fff9e7,#d9ad77); color:#25211d; font-weight:900; font-size:clamp(16px,calc(var(--unit) * .48),24px); box-shadow:1px 3px 5px #0007,inset 0 0 0 2px #cca06a; z-index:2; cursor:pointer; user-select:none; }
    .piece.red { color:var(--red); border:1px solid var(--red); } .piece.black { color:#25272a; border:1px solid #25272a; }
    .piece.selected { transform:translate(-50%,-50%) scale(1.13); outline:3px solid #ffeb46; z-index:5; }
    .piece.turn-piece { box-shadow:1px 3px 6px #0007,inset 0 0 0 2px #dbb17a,0 0 0 2px #f0d59a6b; }
    .piece.wait-piece { filter:brightness(.81) saturate(.75); }
    .piece.selected { filter:none; box-shadow:0 0 13px #ffe36a; }

    .dot { position:absolute; width:4%; height:3.6%; background:#27a263c9; border-radius:50%; box-shadow:0 0 9px #078a4e; transform:translate(-50%,-50%); pointer-events:none; z-index:3; }
    .dot.capture { width:10%; height:9%; background:transparent; border:3px dashed #da3838; }
    .last { position:absolute; width:9.8%; height:8.8%; border:2px dashed #ef9321; border-radius:50%; transform:translate(-50%,-50%); pointer-events:none; z-index:1; }
    .grave { width:calc(var(--unit) * 9); max-width:100%; min-height:31px; background:#12171b77; border-radius:7px; text-align:left; color:#bdbaba; padding:5px 8px; font-size:12px; display:flex; flex-wrap:wrap; align-items:center; gap:5px; }
    .taken { font-size:17px; font-weight:bold; background:#e5cda7; border-radius:50%; width:23px; height:23px; display:inline-flex; justify-content:center; align-items:center; border:1px solid #8e7356; }
    .taken.red { color:#af2525; }.taken.black { color:#222; }
    .rightbar { text-align:left; }
    .rightbar h3 { font-size:17px; color:#f6d49a; margin:0 0 10px; }
    .rightbar .card { margin-top:0; }
    .member { display:flex; justify-content:space-between; gap:6px; align-items:center; border-top:1px solid #535a60; padding:9px 0; font-size:13px; }
    .member strong { overflow-wrap:anywhere; } .member button { font-size:12px; padding:6px 8px; flex-shrink:0; }
    .inline { display:flex; flex-wrap:wrap; gap:7px; align-items:center; }
    .notice { background:#5b4728; border:1px solid #b78b45; border-radius:10px; padding:12px; margin:10px 0; font-size:14px; line-height:1.6; }
    .notice .inline { justify-content:center; margin-top:9px; }
    #voiceStatus { color:#acdbb9; font-size:12px; min-height:18px; }
    .quick-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; }
    .quick-grid button { text-align:center; padding:10px 5px; background:#45505a; border:1px solid #69717a; font-size:13px; }
    .quick-grid button:hover:not(:disabled) { background:#92653d; border-color:#d9a45b; }
    .quick-bubble { position:absolute; top:32%; left:50%; transform:translate(-50%,-50%); z-index:12; max-width:90%; min-width:150px; border-radius:16px; padding:13px 18px; text-align:center; background:#29353bea; color:#fff8e4; border:2px solid #f4ce87; box-shadow:0 8px 25px #0009; pointer-events:none; animation:quickAppear .22s ease-out; }
    .quick-bubble strong { display:block; font-size:12px; color:#f4ca8c; margin-bottom:5px; }
    .quick-bubble span { font-size:clamp(19px,4vw,28px); font-weight:900; white-space:nowrap; }
    @keyframes quickAppear { from {opacity:0;transform:translate(-50%,-35%) scale(.85);} to {opacity:1;transform:translate(-50%,-50%) scale(1);} }

    .overlay { position:fixed; inset:0; z-index:100; background:#000b; display:flex; align-items:center; justify-content:center; padding:16px; }
    .dialog { background:#30363d; border:2px solid #b87b38; border-radius:16px; width:min(100%,400px); box-shadow:0 15px 50px #000a; padding:23px; }
    .dialog h2 { margin:0 0 12px; }.dialog p { line-height:1.6; color:#e4e1dc; }
    #qrBox { display:flex; justify-content:center; padding:10px; width:244px; min-height:244px; background:white; margin:14px auto; }
    #qrBox img { margin:auto; }
    #shareUrl { font-size:11px; overflow-wrap:anywhere; color:#b2d8ff; user-select:text; }
    .footer { margin:15px 0; color:#969fa7; font-size:12px; }
    @media(max-width:800px) { .game-layout { grid-template-columns:1fr; }.rightbar { max-width:500px; margin:auto; width:100%; } }
    @media(max-width:460px) { body { padding:8px; } .card { padding:11px; } .room-top { justify-content:center; } .room-title { text-align:center; } .players { gap:5px; } .player { padding:8px; } .player strong { font-size:14px; } .pill { font-size:10px; padding:2px 5px; } .controls button { font-size:12px; } }
  </style>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div class="shell">
  <h1>♟️ 同學象棋室</h1>
  <p class="subtitle">V2.2 · 好友對弈 · 同學觀戰 · 輪流挑戰</p>
  <div id="welcome" class="welcome card">
    <h2 id="welcomeTitle">一起下象棋吧！</h2>
    <p class="hint" id="welcomeHelp">建立房間後，分享連結或 QR Code 邀請同學。</p>
    <label for="nickname">你的暱稱（不必填真實姓名）</label>
    <input id="nickname" type="text" maxlength="14" placeholder="例如：阿哲" autocomplete="nickname">
    <div id="joinFields" class="hide">
      <label for="joinCode">房間代碼</label>
      <input id="joinCode" type="text" maxlength="12" placeholder="輸入朋友給的房號" autocomplete="off">
    </div>
    <div class="actions"><button id="createRoom" class="primary">＋ 建立房間</button><button id="joinRoom">加入房間</button></div>
    <p id="welcomeStatus" class="hint" role="status">正在準備連線…</p>
  </div>

  <main id="app" class="hide">
    <div class="card">
      <div class="room-top">
        <div><div id="roomTitle" class="room-title">象棋房</div><div id="roomCode" class="room-code"></div></div>
        <div class="room-actions"><button id="copyLink" class="primary">📋 複製邀請連結</button><button id="showQR">▦ 分享 QR Code</button><button id="leaveRoom" class="subtle">🚪 離開房間</button></div>
      </div>
      <div class="players"><div id="redPlayer" class="player"></div><div id="blackPlayer" class="player"></div></div>
      <div id="inviteBanner" class="notice hide"></div>
      <div id="requestBanner" class="notice hide"></div>
    </div>

    <div class="game-layout">
      <div class="board-side">
        <div id="statusBar" class="status" aria-live="polite">等待對局開始</div>
        <div class="controls">
          <button id="flipBoard">🔄 翻轉棋盤</button>
          <button id="undoBtn">↩ 悔棋（3）</button>
          <button id="drawBtn">🤝 提和</button>
          <button id="resignBtn" class="danger">🏳 認輸</button>
          <button id="voiceBtn">🎙️ 開啟語音</button>
          <button id="unmuteAudioBtn" class="subtle hide">🔊 點此播放對方聲音</button>
        </div>
        <div id="voiceStatus" role="status"></div>
        <div id="topTaken" class="grave"></div>
        <div class="board" id="board">
          <svg viewBox="0 0 450 500" preserveAspectRatio="none" aria-label="象棋棋盤">
            <rect x="25" y="25" width="400" height="450" fill="none" stroke="#5c3a1e" stroke-width="2"/>
            <g stroke="#5c3a1e" stroke-width="1.2">
              <path d="M25 75H425 M25 125H425 M25 175H425 M25 225H425 M25 275H425 M25 325H425 M25 375H425 M25 425H425"/>
              <path d="M75 25V225 M125 25V225 M175 25V225 M225 25V225 M275 25V225 M325 25V225 M375 25V225"/>
              <path d="M75 275V475 M125 275V475 M175 275V475 M225 275V475 M275 275V475 M325 275V475 M375 275V475"/>
              <path d="M175 25L275 125 M275 25L175 125 M175 375L275 475 M275 375L175 475"/>
            </g>
            <text x="125" y="258" font-size="22" font-family="serif" text-anchor="middle" fill="#6a4c28" font-weight="bold">楚 河</text>
            <text x="325" y="258" font-size="22" font-family="serif" text-anchor="middle" fill="#6a4c28" font-weight="bold">漢 界</text>
          </svg>
          <div id="layer"></div>
          <div id="quickBubble" class="quick-bubble hide" aria-live="polite"></div>
        </div>
        <div id="bottomTaken" class="grave"></div>
      </div>

      <div class="rightbar">
        <section class="card" id="quickPanel">
          <h3>💬 快捷喊話</h3>
          <div id="quickGrid" class="quick-grid"></div>
          <p class="hint" style="margin:9px 0 0">僅對弈雙方可發送，最多每 3 秒一次。</p>
        </section>
        <section class="card"><h3>👀 觀戰與候補 <span id="viewerCount" class="pill">0</span></h3>
          <div id="viewerList" class="hint">尚無觀戰者</div>
          <button id="challengeBtn" class="primary hide" style="width:100%;margin-top:8px">🙋 我要挑戰下一局</button>
        </section>
        <section id="hostPanel" class="card hide">
          <h3>👑 房主管理</h3><p id="hostInfo" class="hint"></p>
          <label for="hostColor" class="hint">房主下一局執棋：</label>
          <select id="hostColor" style="width:100%;margin:6px 0 9px"><option value="red">紅方（先手）</option><option value="black">黑方（後手）</option></select>
          <label for="rulesMode" class="hint">下一局棋規：</label>
          <select id="rulesMode" style="width:100%;margin:6px 0 9px">
            <option value="relaxed">自由對戰（允許自陷被將）</option>
            <option value="strict">標準對戰（必須應將）</option>
          </select>
          <div id="candidateList"></div>
          <button id="abandonBtn" class="danger hide" style="width:100%;margin-top:10px">結束離線對局</button>
        </section>
        <section class="card"><h3>📖 小提醒</h3>
          <p class="hint">每局紅棋先走。自由對戰可冒險不應將，被吃掉將帥就輸；標準對戰則須應將。只有兩位玩家能走棋，悔棋、提和都須對手同意。</p>
          <p id="roomNotice" class="hint"></p>
        </section>
      </div>
    </div>
    <p class="footer">熟人好友約戰用，請以暱稱參與；房間連結不要公開張貼。</p>
  </main>
</div>

<div id="qrModal" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="qrTitle">
  <div class="dialog"><h2 id="qrTitle">掃描 QR Code 加入房間</h2>
    <div id="qrBox"></div><p id="qrStatus" class="hint"></p><p id="shareUrl"></p>
    <div class="inline" style="justify-content:center"><button id="qrCopy" class="primary">複製連結</button><button id="qrDownload">下載 QR 圖片</button><button id="qrClose">關閉</button></div>
  </div>
</div>
<div id="resultModal" class="overlay hide" role="dialog" aria-modal="true" aria-labelledby="resultTitle">
  <div class="dialog"><h2 id="resultTitle">對局結束</h2><p id="resultText"></p><button id="resultClose" class="primary">返回房間</button></div>
</div>
<audio id="remoteAudio" autoplay playsinline></audio>

<script type="module">
  import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
  import { getAuth, signInAnonymously, onAuthStateChanged } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js';
  import { getDatabase, ref, get, set, update, onValue, onChildAdded, remove, push, runTransaction, onDisconnect } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js';

  const firebaseConfig = {
    apiKey:'AIzaSyDk0esu3nkwXG7LHNdSE8XEcC0IBDZ25aA',
    authDomain:'battle-f41ad.firebaseapp.com',
    databaseURL:'https://battle-f41ad-default-rtdb.asia-southeast1.firebasedatabase.app',
    projectId:'battle-f41ad', storageBucket:'battle-f41ad.firebasestorage.app',
    messagingSenderId:'429805603890', appId:'1:429805603890:web:53d1ea22c238a24fa4402b'
  };
  const db = getDatabase(initializeApp(firebaseConfig));
  const auth = getAuth();
  const $ = id => document.getElementById(id);
  const initialBoard = () => [
    ['b_c','b_m','b_x','b_s','b_j','b_s','b_x','b_m','b_c'],
    Array(9).fill(''), ['', 'b_p','','','','','','b_p',''],
    ['b_z','','b_z','','b_z','','b_z','','b_z'], Array(9).fill(''), Array(9).fill(''),
    ['r_b','','r_b','','r_b','','r_b','','r_b'], ['', 'r_p','','','','','','r_p',''],
    Array(9).fill(''), ['r_c','r_m','r_x','r_s','r_j','r_s','r_x','r_m','r_c']
  ];
  const names = { b_c:'車',b_m:'馬',b_x:'象',b_s:'士',b_j:'將',b_p:'砲',b_z:'卒',r_c:'俥',r_m:'傌',r_x:'相',r_s:'仕',r_j:'帥',r_p:'炮',r_b:'兵' };
  const other = s => s === 'red' ? 'black' : 'red';

  function cellClick(r,c) {
    const g=room?.game,side=seatOf();if(!g||g.status!=='playing'||side!==g.turn)return;
    const p=g.board[r]?.[c];
    if(!picked) {
      if(p&&pieceSide(p)===side) {picked=[r,c];possibles=legalMoves(r,c,g.board,g.rulesMode);renderBoard();}
      return;
    }
    if(p&&pieceSide(p)===side) {picked=[r,c];possibles=legalMoves(r,c,g.board,g.rulesMode);renderBoard();return;}
    const [fr,fc]=picked;
    if(!possibles.some(([tr,tc])=>tr===r&&tc===c)) {picked=null;possibles=[];renderBoard();return;}
    picked=null;possibles=[];renderBoard();submitMove(fr,fc,r,c,side,g);
  }
  async function submitMove(fr,fc,tr,tc,side,seen) {
    try {
      const result=await runTransaction(gameRef,current=>{
        if(!current||current.round!==seen.round||current.version!==seen.version||current.turn!==side||current.status!=='playing'||seatOf()!==side)return;
        const piece=current.board?.[fr]?.[fc];
        if(!piece||pieceSide(piece)!==side||!legalMoves(fr,fc,current.board,current.rulesMode).some(([r,c])=>r===tr&&c===tc))return;
        const board=copyBoard(current.board),victim=board[tr][tc];board[tr][tc]=piece;board[fr][fc]='';
        const history=[...(current.history||[]),{board:current.board,turn:current.turn,lastMove:current.lastMove||null,captured:current.captured||{red:[],black:[]},positionHistory:current.positionHistory||[]}].slice(-30);
        const captured={red:[...(current.captured?.red||[])],black:[...(current.captured?.black||[])]};
        if(victim)captured[side].push(victim);
        const next=other(side),lastMove={from:[fr,fc],to:[tr,tc],side,capture:!!victim};
        const isKingCaptured=!!victim&&victim[2]==='j';
        const noMoves=!isKingCaptured&&!hasAnyMove(next,board,current.rulesMode),check=!isKingCaptured&&inCheck(next,board);
        const positionHistory=[...(current.positionHistory||[]),boardSignature(board,next)].slice(-80);
        return {...current,board,captured,turn:next,lastMove,history,positionHistory,moveNo:(current.moveNo||0)+1,version:current.version+1,
          status:isKingCaptured||noMoves?'finished':'playing',winner:isKingCaptured||noMoves?side:null,reason:isKingCaptured?'吃掉將帥':noMoves?(check?'將死':'困斃'):''};
      },{applyLocally:false});
      if(!result.committed) {showToast('盤面已更新，請依最新局面重新落子。');return;}
      const next=result.snapshot.val();
      // 落子音效由棋局同步監聽統一觸發，讓雙方都有聲音且避免自己重複播放。
      if(room.requests?.undo)remove(ref(db,`chessV2/${roomId}/requests/undo`)).catch(()=>{});
      if(room.requests?.draw)remove(ref(db,`chessV2/${roomId}/requests/draw`)).catch(()=>{});
    }catch(e){showToast(friendlyError(e));}
  }

  // 棋子音效：Web Audio 自製低音量木質敲擊，不用刺耳的鋸齒波。
  let audioContext=null,woodBuffer=null;
  function getAudio() {
    const Audio=window.AudioContext||window.webkitAudioContext;if(!Audio)return null;
    if(!audioContext)audioContext=new Audio();
    if(audioContext.state==='suspended')audioContext.resume().catch(()=>{});
    if(!woodBuffer) {
      const length=Math.floor(audioContext.sampleRate*.115);
      woodBuffer=audioContext.createBuffer(1,length,audioContext.sampleRate);
      const samples=woodBuffer.getChannelData(0);
      for(let i=0;i<length;i++)samples[i]=(Math.random()*2-1)*Math.exp(-i/(length*.16));
    }
    return audioContext;
  }
  function woodTap(ctx,at,volume=0.11,pitch=215) {
    const noise=ctx.createBufferSource(),low=ctx.createBiquadFilter(),env=ctx.createGain();
    noise.buffer=woodBuffer;low.type='bandpass';low.frequency.value=850;low.Q.value=.62;
    noise.connect(low);low.connect(env);env.connect(ctx.destination);
    env.gain.setValueAtTime(.0001,at);env.gain.exponentialRampToValueAtTime(volume,at+.003);
    env.gain.exponentialRampToValueAtTime(.0001,at+.086);
    noise.start(at);noise.stop(at+.11);
    const osc=ctx.createOscillator(),tone=ctx.createGain();osc.type='sine';
    osc.frequency.setValueAtTime(pitch,at);osc.frequency.exponentialRampToValueAtTime(pitch*.56,at+.09);
    tone.gain.setValueAtTime(.0001,at);tone.gain.exponentialRampToValueAtTime(volume*.48,at+.002);
    tone.gain.exponentialRampToValueAtTime(.0001,at+.092);
    osc.connect(tone);tone.connect(ctx.destination);osc.start(at);osc.stop(at+.1);
  }
  function playSound(type) {
    try {
      const ctx=getAudio();if(!ctx)return;
      const t=ctx.currentTime+.005;
      if(type==='eat') {woodTap(ctx,t,.13,235);woodTap(ctx,t+.095,.09,170);}
      else if(type==='check') {woodTap(ctx,t,.10,270);woodTap(ctx,t+.115,.075,325);}
      else if(type==='win') {woodTap(ctx,t,.11,280);woodTap(ctx,t+.15,.11,345);woodTap(ctx,t+.30,.095,430);}
      else woodTap(ctx,t,.085,215);
    }catch(e){/* 使用者禁止聲音時仍可正常下棋 */}
  }

  // WebRTC 重新設計：每次雙方開麥，都產生全新會話身分與 SDP/ICE 空間。
  // 不再沿用前一通的 offer/answer；一方關閉後，另一方可留在等待狀態。
  const rtcConfig={iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]};
  const voiceRoot=(id,round)=>`chessV2/${id}/voice/live/r${round}`;
  const currentVoice=(generation)=>voiceEnabled&&voiceGeneration===generation&&roomId===voiceRoomId;
  function voiceStatus(t) {$('voiceStatus').textContent=t;}
  function closePeer() {
    for(const u of voiceUnsubs)try{u();}catch(e){}voiceUnsubs=[];
    const pc=peerConn;peerConn=null;voicePair='';
    if(pc){pc.ontrack=null;pc.onicecandidate=null;pc.onconnectionstatechange=null;pc.close();}
    const audio=$('remoteAudio');audio.pause();audio.srcObject=null;
    $('unmuteAudioBtn').classList.add('hide');

  $('unmuteAudioBtn').onclick=async()=>{

  function tryRemotePlayback() {

    audio.play().then(()=>$('unmuteAudioBtn').classList.add('hide')).catch(()=>{
      $('unmuteAudioBtn').classList.remove('hide');voiceStatus('已收到對方語音，請點「播放對方聲音」。');
    });

  async function stopVoice() {
    if(voiceStopping)return;
    const sid=voiceActivation,active=voiceActiveRef,disconnect=voiceDisconnectJob;
    const pair=voicePair,base=voiceRoot(voiceRoomId,voiceRound);
    ++voiceGeneration;voiceEnabled=false;voiceStopping=true;
    voiceActivation='';voiceActiveRef=null;voiceDisconnectJob=null;
    if(voiceActiveUnsub){voiceActiveUnsub();voiceActiveUnsub=null;}
    closePeer();
    if(localStream){localStream.getTracks().forEach(track=>track.stop());localStream=null;}
    voiceStatus('語音已關閉');if(room)renderControls();
    try {
      if(disconnect)await disconnect.cancel();
      if(active&&sid)await runTransaction(active,current=>current?.sid===sid?null:undefined,{applyLocally:false});
      // 已結束的協商資料可以清除；目前其他用戶的新協商不受影響。
      if(pair)await remove(ref(db,`${base}/sessions/${pair}`)).catch(()=>{});
    }catch(e){voiceStatus('語音已關閉，遠端狀態同步稍有延遲。');}
    finally {voiceStopping=false;if(room)renderControls();}
  }
  $('voiceBtn').onclick=async()=>{
    if(voiceStopping)return;
    if(voiceEnabled) {await stopVoice();return;}
    const side=seatOf();if(!side||!room?.seats?.[other(side)])return;
    const generation=++voiceGeneration;
    voiceEnabled=true;voiceSide=side;voiceRound=room.game.round;voiceRoomId=roomId;
    voiceActivation=randomCode()+randomCode();
    voiceStatus('正在取得麥克風權限…');renderControls();
    try {
      const stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true},video:false});
      if(!currentVoice(generation)){stream.getTracks().forEach(t=>t.stop());return;}
      localStream=stream;
      const active=ref(db,`${voiceRoot(voiceRoomId,voiceRound)}/active/${side}`);
      voiceActiveRef=active;
      voiceDisconnectJob=onDisconnect(active);
      await voiceDisconnectJob.remove();
      if(!currentVoice(generation))return;
      await set(active,{sid:voiceActivation,uid,at:Date.now()});
      if(!currentVoice(generation))return;
      voiceActiveUnsub=onValue(ref(db,`${voiceRoot(voiceRoomId,voiceRound)}/active`),snap=>{
        if(!currentVoice(generation))return;
        const both=snap.val()||{};
        if(both[side]?.sid!==voiceActivation) {
          closePeer();voiceStatus('此席位的語音已由另一個分頁啟用，請關閉後再試。');return;
        }
        const otherSide=other(side),remote=both[otherSide];
        if(!remote?.sid||remote.uid!==room?.seats?.[otherSide]) {
          if(peerConn)closePeer();
          voiceStatus('🎙️ 麥克風已開啟，等待對方開啟語音…');return;
        }
        const redSid=both.red?.sid,blackSid=both.black?.sid;
        if(!redSid||!blackSid)return;
        const pair=`${redSid}_${blackSid}`;
        if(pair===voicePair)return;
        closePeer();voicePair=pair;
        void connectVoicePair(generation,side,pair);
      },e=>voiceStatus('語音狀態同步失敗：'+friendlyError(e)));
      voiceStatus('🎙️ 麥克風已開啟，等待對方…');
    }catch(e){
      if(currentVoice(generation)) {
        await stopVoice();
        voiceStatus('無法開啟語音：請確認 HTTPS、麥克風權限及網路。');
      }
    }
  };
  async function connectVoicePair(generation,side,pair) {
    if(!currentVoice(generation)||voicePair!==pair||!localStream)return;
    const base=`${voiceRoot(voiceRoomId,voiceRound)}/sessions/${pair}`;
    const pc=new RTCPeerConnection(rtcConfig);peerConn=pc;
    localStream.getTracks().forEach(track=>pc.addTrack(track,localStream));
    pc.ontrack=e=>{
      if(!currentVoice(generation)||peerConn!==pc)return;
      const audio=$('remoteAudio');
      audio.srcObject=e.streams?.[0]||new MediaStream([e.track]);
      voiceStatus('正在連接對方音訊…');tryRemotePlayback();
    };
    pc.onconnectionstatechange=()=>{
      if(!currentVoice(generation)||peerConn!==pc)return;
      if(pc.connectionState==='connected')voiceStatus('🟢 雙人語音已連線');
      else if(pc.connectionState==='failed')voiceStatus('⚠️ 網路無法建立語音，請雙方關閉後再開啟。');
      else if(pc.connectionState==='disconnected')voiceStatus('語音暫時中斷，正在等待網路恢復…');
    };
    const localCandidates=ref(db,`${base}/candidates_${side}`),remoteCandidates=ref(db,`${base}/candidates_${other(side)}`);
    pc.onicecandidate=e=>{
      if(e.candidate&&currentVoice(generation)&&voicePair===pair&&peerConn===pc)
        push(localCandidates,e.candidate.toJSON()).catch(()=>{});
    };
    const pending=[];
    let applyingRemote=false;
    const flush=async()=>{
      while(pending.length&&pc.remoteDescription&&pc.signalingState!=='closed') {
        try {await pc.addIceCandidate(pending.shift());}catch(e){}
      }
    };
    voiceUnsubs.push(onChildAdded(remoteCandidates,snap=>{
      if(!currentVoice(generation)||voicePair!==pair||peerConn!==pc)return;
      const value=snap.val();if(!value)return;
      const candidate=new RTCIceCandidate(value);
      if(!pc.remoteDescription||applyingRemote)pending.push(candidate);
      else pc.addIceCandidate(candidate).catch(()=>{});
    }));
    try {
      if(side==='red') {
        voiceUnsubs.push(onValue(ref(db,`${base}/answer`),async snap=>{
          if(!snap.exists()||!currentVoice(generation)||voicePair!==pair||peerConn!==pc||applyingRemote||pc.remoteDescription)return;
          applyingRemote=true;
          try {await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));await flush();}
          catch(e){voiceStatus('接收對方語音回覆失敗，請關閉後重試。');}
          finally {applyingRemote=false;}
        }));
        const offer=await pc.createOffer();
        if(!currentVoice(generation)||voicePair!==pair||peerConn!==pc)return;
        await pc.setLocalDescription(offer);
        if(!currentVoice(generation)||voicePair!==pair||peerConn!==pc)return;
        await set(ref(db,`${base}/offer`),{type:offer.type,sdp:offer.sdp});
      } else {
        voiceUnsubs.push(onValue(ref(db,`${base}/offer`),async snap=>{
          if(!snap.exists()||!currentVoice(generation)||voicePair!==pair||peerConn!==pc||applyingRemote||pc.remoteDescription)return;
          applyingRemote=true;
          try {
            await pc.setRemoteDescription(new RTCSessionDescription(snap.val()));await flush();
            if(!currentVoice(generation)||voicePair!==pair||peerConn!==pc)return;
            const answer=await pc.createAnswer();await pc.setLocalDescription(answer);
            if(!currentVoice(generation)||voicePair!==pair||peerConn!==pc)return;
            await set(ref(db,`${base}/answer`),{type:answer.type,sdp:answer.sdp});
          }catch(e){voiceStatus('語音協商失敗，請關閉後重試。');}
          finally {applyingRemote=false;}
        }));
      }
    }catch(e){if(currentVoice(generation)&&voicePair===pair)voiceStatus('語音建立失敗，請關閉後重試。');}
  }
  window.addEventListener('pagehide',()=>{if(voiceEnabled)void stopVoice();});

</script>
